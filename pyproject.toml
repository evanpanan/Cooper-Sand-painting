[project]
name = "sand-painting-motion"
version = "1.0.0"
description = "Sand painting animation skill for coding agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Cooper Sand Painting", email = "cooper@sandart.example" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: Artistic Software"
]
keywords = ["sand-painting", "animation", "generative-art", "video", "skill"]
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "playwright>=1.40.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=7.4.0"
]

[project.scripts]
sand-render = "scripts.engine.render:main"
sand-qa = "scripts.qa:main"
sand-lint = "scripts.storyboard_lint:main"
sand-breakdown = "scripts.analyze.breakdown:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py310"
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # Line too long - handled by line-length setting
    "B008",   # Do not perform function calls in argument defaults
    "TCH001", # Move third-party import into a TYPE_CHECKING block
]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]
case-sensitive = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/engine/render.py" = ["B006", "SIM115"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra -q --strict-markers"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["__pycache__", "tests", "scripts/engine/lib", "scripts/engine/scenes"]
